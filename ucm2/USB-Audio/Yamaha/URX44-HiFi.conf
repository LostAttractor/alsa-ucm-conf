# Native mode, 44.1-96 kHz: USB MAIN A/B/C occupy hardware channels 0-5.

SectionDevice."Line1" {
	Comment "USB MAIN A"

	Value {
		PlaybackPriority 120
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "yamaha_urx44_stereo_out"
		Direction Playback
		HWChannels 18
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

