Comment "Yamaha URX44"

# Requires the kernel quirk selecting USB configuration 2 (native mode).
# Altsetting 1: 18 channels at 44.1/48/88.2/96 kHz.
# Altsetting 2: 10 channels at 176.4/192 kHz.
# The class-compliant USB configuration has a different channel layout.

Include.pcm_split.File "/common/pcm/split.conf"

# Define the shared PCMs once: LibraryConfig and macros are shared by all verbs.
# Each ALSA hw chmap entry describes the complete hardware stream.
Define.URX44StereoMap "FL FR FL FR FL FR FL FR FL FR FL FR FL FR FL FR FL FR"
Define.URX44MonoMap "FL FR FL FR FL FR MONO MONO MONO MONO FL FR FL FR FL FR FL FR"

Macro.stereo_out.SplitPCM {
	Name "yamaha_urx44_stereo_out"
	Direction Playback
	Format S32_LE
	Channels 2
	HWChannels 18
	HWChannelPos0 "${var:URX44StereoMap}"
}

Macro.stereo_in.SplitPCM {
	Name "yamaha_urx44_stereo_in"
	Direction Capture
	Format S32_LE
	Channels 2
	HWChannels 18
	HWChannelPos0 "${var:URX44StereoMap}"
}

Macro.mono_in.SplitPCM {
	Name "yamaha_urx44_mono_in"
	Direction Capture
	Format S32_LE
	Channels 1
	HWChannels 18
	HWChannelPos0 "${var:URX44MonoMap}"
}

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/Yamaha/URX44-HiFi.conf"
}

SectionUseCase."Multitrack" {
	Comment "Multitrack"
	File "/USB-Audio/Yamaha/URX44-Multitrack.conf"
}

Include.dhw.File "/common/directm.conf"

Macro.direct.DirectUseCase {
	Id "Direct"
	CardName "${CardName}"
	PlaybackChannels 18
	CaptureChannels 18
}

Macro.direct1764.DirectUseCase {
	Id "Direct 176400Hz"
	CardName "Yamaha URX44 (176.4 kHz)"
	PlaybackChannels 10
	CaptureChannels 10
	PlaybackRate 176400
	CaptureRate 176400
}

Macro.direct192.DirectUseCase {
	Id "Direct 192000Hz"
	CardName "Yamaha URX44 (192 kHz)"
	PlaybackChannels 10
	CaptureChannels 10
	PlaybackRate 192000
	CaptureRate 192000
}
